<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Concept 2, "Branch and merge" (v2), the large-size master (128 px and up, thinner lanes; source-mid.svg
       has the heavier weights for 32-64 px): two lanes branch from one commit, zig-zag apart and
       merge into one commit; together they outline the bolt. Commits are drawn like the graph's
       nodes: a ring in the lane's colour around a dark centre (where the app puts the avatar). -->
  <defs>
    <linearGradient id="i2-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c4282"/>
      <stop offset="1" stop-color="#152049"/>
    </linearGradient>
    <linearGradient id="i2-cool" gradientUnits="userSpaceOnUse" x1="0" y1="72" x2="0" y2="440">
      <stop offset="0" stop-color="#43efb8"/>
      <stop offset="0.5" stop-color="#24c6e8"/>
      <stop offset="1" stop-color="#3b8cff"/>
    </linearGradient>
    <linearGradient id="i2-warm" gradientUnits="userSpaceOnUse" x1="0" y1="72" x2="0" y2="440">
      <stop offset="0" stop-color="#f2ca33"/>
      <stop offset="0.5" stop-color="#f25d2e"/>
      <stop offset="1" stop-color="#d90171"/>
    </linearGradient>
    <linearGradient id="i2-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24c6e8" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#8e00c2" stop-opacity="1"/>
      <stop offset="1" stop-color="#d90171" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="i2-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c517b6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c517b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i2-core" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#2b3766"/>
      <stop offset="0.55" stop-color="#121a38"/>
      <stop offset="1" stop-color="#0a0f24"/>
    </radialGradient>
    <clipPath id="i2-clip"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>
  <!-- No shadow, so no margin: the tile (drawn at 16..496) fills the canvas edge to edge. -->
  <g data-edge="full" transform="translate(256 256) scale(1.0666667) translate(-256 -256)">
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#i2-plate)"/>
  <g clip-path="url(#i2-clip)">
    <circle cx="256" cy="256" r="250" fill="url(#i2-glow)"/>
  </g>
  <!-- the bolt between the two lanes -->
  <path d="M335.2,72.4 L108.0,284.9 L234.0,284.9 L164.2,439.6 L405.5,218.6 L279.5,218.6 Z" fill="url(#i2-fill)"/>
  <g fill="none" stroke-width="30" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="335.2,72.4 108.0,284.9 234.0,284.9 164.2,439.6" stroke="url(#i2-cool)"/>
    <polyline points="335.2,72.4 279.5,218.6 405.5,218.6 164.2,439.6" stroke="url(#i2-warm)"/>
  </g>
  <!-- commits: the branch point and the warm lane's corner (warm), the cool lane's corner and the merge (cool) -->
  <g fill="url(#i2-core)" stroke-width="15">
    <circle cx="335.2" cy="72.4" r="35.0" stroke="#f2ca33"/>
    <circle cx="405.5" cy="218.6" r="35.0" stroke="#f25d2e"/>
    <circle cx="108.0" cy="284.9" r="35.0" stroke="#24c6e8"/>
    <circle cx="164.2" cy="439.6" r="35.0" stroke="#3b8cff"/>
  </g>
  </g>
</svg>
