<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- GitBolt round 4, R3C: fading lanes, set B, shadow 1 (3 lanes, 32/16 px) -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a4a"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0669f7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0669f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="litFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cc4ff"/>
      <stop offset="1" stop-color="#2a82ff"/>
    </linearGradient>
    <linearGradient id="shadeFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a80ff"/>
      <stop offset="1" stop-color="#0757e0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="plateClip">
      <path d="M152 32H360C440 32 480 72 480 152V360C480 440 440 480 360 480H152C72 480 32 440 32 360V152C32 72 72 32 152 32Z"/>
    </clipPath>
      <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="url(#fadeY)"/>
    </mask>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <!-- K85: scaled about the centre so the plate inset is about 6px of 512 (was 32px) -->
  <g transform="translate(256 256) scale(1.116) translate(-256 -256)">

  <path d="M152 32H360C440 32 480 72 480 152V360C480 440 440 480 360 480H152C72 480 32 440 32 360V152C32 72 72 32 152 32Z" fill="url(#plate)"/>
  <g clip-path="url(#plateClip)">
    <circle cx="256" cy="262" r="230" fill="url(#glow)"/>
    <g mask="url(#fade)">
      <line x1="128" y1="0" x2="128" y2="512" stroke="#2ece9d" stroke-width="40"/>
      <line x1="256" y1="0" x2="256" y2="512" stroke="#c517b6" stroke-width="40"/>
      <line x1="384" y1="0" x2="384" y2="512" stroke="#f2ca33" stroke-width="40"/>
    </g>
    <path d="M152 32H360C440 32 480 72 480 152V360C480 440 440 480 360 480H152C72 480 32 440 32 360V152C32 72 72 32 152 32Z" fill="url(#sheen)"/>
  </g>
  <path d="M152 34.5H360C438.5 34.5 477.5 73.5 477.5 152V360C477.5 438.5 438.5 477.5 360 477.5H152C73.5 477.5 34.5 438.5 34.5 360V152C34.5 73.5 73.5 34.5 152 34.5Z"
        fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="5"/>

  <!-- Bolt shadows, cast on the lanes and the plate -->
  <g clip-path="url(#plateClip)">
  <path d="M318 74 150 290H250L202 446 366 220H264Z" transform="translate(14 22)" fill="#02040c" stroke="#02040c" stroke-width="20" stroke-linejoin="round" opacity="0.75" filter="url(#drop)"/>
  <path d="M318 74 150 290H250L202 446 366 220H264Z" fill="none" stroke="#050a1a" stroke-width="44" stroke-linejoin="round"/>
  </g>
  <!-- Bolt: a lit upper-left face and a shaded lower-right face. -->
  <g stroke-linejoin="round" stroke-width="14">
    <path d="M318 74 150 290H250L202 446 366 220H264Z" fill="url(#shadeFace)" stroke="#0a55d8"/>
    <path d="M318 74 150 290H250L264 220Z" fill="url(#litFace)" stroke="none"/>
  </g>

  </g>
</svg>
