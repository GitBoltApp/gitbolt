<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Concept 2, "Branch and merge" (v2), the 16 px master: the same two lanes, thicker, without
       the commits, which would only blur at that size. -->
  <defs>
    <linearGradient id="i2s-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c4282"/>
      <stop offset="1" stop-color="#152049"/>
    </linearGradient>
    <linearGradient id="i2s-cool" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="442">
      <stop offset="0" stop-color="#43efb8"/>
      <stop offset="0.5" stop-color="#24c6e8"/>
      <stop offset="1" stop-color="#3b8cff"/>
    </linearGradient>
    <linearGradient id="i2s-warm" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="442">
      <stop offset="0" stop-color="#f2ca33"/>
      <stop offset="0.5" stop-color="#f25d2e"/>
      <stop offset="1" stop-color="#d90171"/>
    </linearGradient>
    <linearGradient id="i2s-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24c6e8" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#8e00c2" stop-opacity="1"/>
      <stop offset="1" stop-color="#d90171" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="i2s-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c517b6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c517b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i2s-core" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#2b3766"/>
      <stop offset="0.55" stop-color="#121a38"/>
      <stop offset="1" stop-color="#0a0f24"/>
    </radialGradient>
    <clipPath id="i2s-clip"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>
  <!-- No shadow, so no margin: the tile (drawn at 16..496) fills the canvas edge to edge. -->
  <g data-edge="full" transform="translate(256 256) scale(1.0666667) translate(-256 -256)">
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#i2s-plate)"/>
  <g clip-path="url(#i2s-clip)">
    <circle cx="256" cy="256" r="250" fill="url(#i2s-glow)"/>
  </g>
  <!-- the bolt between the two lanes -->
  <path d="M337.0,70.2 L103.9,285.2 L233.5,285.2 L162.1,441.8 L409.7,218.2 L280.1,218.2 Z" fill="url(#i2s-fill)"/>
  <g fill="none" stroke-width="56" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="337.0,70.2 103.9,285.2 233.5,285.2 162.1,441.8" stroke="url(#i2s-cool)"/>
    <polyline points="337.0,70.2 280.1,218.2 409.7,218.2 162.1,441.8" stroke="url(#i2s-warm)"/>
  </g>
  </g>
</svg>
