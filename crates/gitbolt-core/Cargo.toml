[package]
name = "gitbolt-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
testing = []

[dependencies]
gix.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
regex.workspace = true
sha2.workspace = true
ts-rs.workspace = true
tempfile.workspace = true
encoding_rs.workspace = true
base64.workspace = true
dirs.workspace = true
notify.workspace = true

[dev-dependencies]
insta.workspace = true
# `#[tokio::test(start_paused = true)]` for the settings debounce test.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

# The platform module's Windows side (src/platform/): job objects, file ids, named pipes.
[target.'cfg(windows)'.dependencies]
dunce.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
# The shell's COM dialogs (folder picker) and calls (Open With, URLs): src/openers/win32.rs.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
