[workspace]
resolver = "3"
members = ["crates/gitbolt-core", "crates/gitbolt-forge", "crates/gitbolt-app", "crates/gitbolt-harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
gitbolt-core = { path = "crates/gitbolt-core" }
gitbolt-forge = { path = "crates/gitbolt-forge" }
gix = "0.88"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "net", "io-util"] }
tokio-util = "0.7.19"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
regex = "1.13"
nix = { version = "0.31", features = ["signal", "process", "user", "fs"] }
ts-rs = "12.0.1"
# Forge tokens in the Secret Service (spec #4 §2; core spec §14.3). v1 feature: zbus Secret Service on Linux.
keyring = "4.2"
tempfile = "3.27"
# Retry-After as an HTTP date (forge HTTP, 4A T2). Already in the tree through hyper.
httpdate = "1.0.3"
encoding_rs = "0.8.42"
base64 = "0.23.1"
insta = "1.48"
axum = { version = "0.8.9", features = ["ws"] }
tokio-tungstenite = "0.30"
# Tauri 3 alpha + the official CEF (Chromium) runtime (Task 14). Pinned exactly: this is an
# alpha series. See vendor/tauri-runtime-cef/GITBOLT-PATCH.md for the vendored runtime patch.
tauri = { version = "=3.0.0-alpha.3", features = [] }
tauri-build = { version = "=3.0.0-alpha.2", features = [] }
tauri-runtime-cef = "=3.0.0-alpha.4"
tauri-plugin-clipboard-manager = "=3.0.0-alpha.1"
# Avatars and URL opening (plan 1B Task 5).
sha2 = "0.11.0"
ureq = "3.4.2"
dirs = "7.0.0"
# The GLib program name (WM_CLASS) for the app window; already in the tree through gtk4.
glib = "0.22"
# Pre-release: the only line compatible with tauri 3 alpha. Only its free function
# `open_url` is used; the plugin isn't registered and there's no JS package (plan 1C does the same).
tauri-plugin-opener = "=3.0.0-alpha.1"
# "Other…" (feedback H32): the xdg-desktop-portal Open With chooser over D-Bus. Already in the
# tree through tauri-plugin-opener; same version and features.
zbus = "5.19"
# The main window's X11 id, the folder-picker portal's parent (plan 1C, spec §13). Already in the
# tree through tauri; same version.
raw-window-handle = "0.6.2"
# The active-tab file watcher (plan 1C Task 6): inotify on Linux.
notify = "8.2.0"

[patch.crates-io]
# CEF issue #3002 idle-busy-loop workaround; see vendor/tauri-runtime-cef/GITBOLT-PATCH.md.
tauri-runtime-cef = { path = "vendor/tauri-runtime-cef" }

# Build speed (docs/dev-setup.md, "Build and test speed"). Dev and test builds keep file:line
# for our own crates (panic locations and backtraces still point at the line) and drop full debug
# info: smaller objects, faster links, a smaller target/. Dependencies keep only their symbols.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release builds (`just package`, `just build-app`) are only ever built on the dev machine. Our own
# crates build incrementally, so a one-line change in core re-optimises only what it touched; the
# dependencies stay non-incremental (and cached by sccache). Still opt-level 3, no LTO.
[profile.release]
incremental = true
