# Release: `just release <version>` commits the version bump and tags it v<version>; pushing them
# together (git push origin main v<version>, or GitBolt's Push with "Push tags with branches")
# runs one build, on main: it builds the .deb and the Arch package on Linux and the two Windows
# installers (NSIS and MSI, unsigned for now), checks them, and uploads them with SHA256SUMS to a
# draft GitHub release for review. Building on main matters for speed: only
# main's runs save caches (a tag's run can restore main's but not another tag's), so each release
# warms the next one, while GitHub keeps the caches (7 days unused).
#
# The `plan` job decides what a run does:
# - a push to main (one that changes Cargo.lock, as a release's version bump does) releases the
#   v* tag on that commit, if it has one, and otherwise does nothing;
# - a pushed tag waits for main's run on the same commit and stops if that one releases it; if not
#   (the tag was pushed after its commit), it builds the release itself, from cold caches;
# - "Run workflow" (workflow_dispatch) on main with a tag releases that tag, warm; without one it's
#   a dry run: the same build and checks, the packages kept as a workflow artifact, no release.
# See docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [Cargo.lock]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release this tag (v1.2.3): build its commit and draft the release. Empty: a dry run.'
        required: false
        default: ''

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with the justfile's check-tauri-cli recipe and scripts/licenses.sh.
  TAURI_CLI_VERSION: 3.0.0-alpha.4
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # a tag's run looks for main's run on the same commit
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: What this run builds and releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # The v* tags on commit $1, from the remote (an annotated tag's peeled `^{}` line has the
          # commit; a lightweight tag's own line does).
          tags_at() {
            git ls-remote --tags "https://github.com/$GH_REPO" 'v*' |
              awk -v c="$1" '$1 == c { n = $2; sub(/^refs\/tags\//, "", n); sub(/\^\{\}$/, "", n); print n }' | sort -u
          }
          commit_of() {
            git ls-remote --tags "https://github.com/$GH_REPO" "refs/tags/$1" "refs/tags/$1^{}" |
              awk '{ c = $1 } $2 ~ /\^\{\}$/ { p = $1 } END { print (p != "" ? p : c) }'
          }
          build=true tag='' sha=$GITHUB_SHA
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "$INPUT_TAG" ]; then
              tag=$INPUT_TAG sha=$(commit_of "$tag")
              [ -n "$sha" ] || { echo "::error::No tag $tag on $GH_REPO"; exit 1; }
            fi
          elif [ "$GITHUB_REF_TYPE" = branch ]; then
            sleep 10 # a tag pushed with its commit is in place by now
            mapfile -t tags < <(tags_at "$GITHUB_SHA")
            if [ "${#tags[@]}" -eq 0 ]; then
              build=false
              echo "No v* tag on $GITHUB_SHA: nothing to release."
            elif [ "${#tags[@]}" -gt 1 ]; then
              echo "::error::Several v* tags on $GITHUB_SHA (${tags[*]}): release one with Run workflow."
              exit 1
            else
              tag=${tags[0]}
            fi
          else
            tag=$GITHUB_REF_NAME
            # Main's run on this commit releases it if it saw the tag. Wait for its plan, then
            # build here only if it didn't (the tag came after the commit, or there's no main run).
            main_builds=0
            for i in $(seq 1 30); do
              runs=$(gh api "repos/$GH_REPO/actions/workflows/release.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push" --jq '[.workflow_runs[].id] | join(" ")')
              if [ -z "$runs" ]; then
                # None yet: give a push of the commit with the tag a minute to show up.
                [ "$i" -lt 6 ] || break
                sleep 10
                continue
              fi
              pending=0 main_builds=0
              for id in $runs; do
                state=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "Plan") | .status + ":" + (.conclusion // "")] | first // "none"')
                case $state in
                  completed:success)
                    b=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "Build and check the packages") | .conclusion // "running"] | first // "skipped"')
                    [ "$b" = skipped ] || main_builds=1 ;;
                  completed:*) ;;
                  *) pending=1 ;;
                esac
              done
              [ "$pending" = 1 ] || break
              sleep 10
            done
            if [ "$main_builds" = 1 ]; then
              build=false
              echo "Main's run on $GITHUB_SHA releases $tag."
            fi
          fi
          echo "build=$build tag=${tag:-none} sha=$sha"
          { echo "build=$build"; echo "tag=$tag"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build and check the packages
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Version
        id: version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          conf=$(jq -er .version crates/gitbolt-app/tauri.conf.json)
          if [ -n "$TAG" ]; then
            v=${TAG#v}
            if [ "$v" != "$conf" ]; then
              echo "::error::The tag $TAG doesn't match tauri.conf.json's version $conf; tag with 'just release <version>'."
              exit 1
            fi
          else
            v=$conf
          fi
          python3 scripts/version.py check "$v"
          cef=$(awk '$0 == "name = \"cef\"" { getline; print }' Cargo.lock | sed -n 's/^version = "[^+"]*+\([^"]*\)"$/\1/p')
          [ -n "$cef" ] || { echo "::error::No CEF version in Cargo.lock's cef entry"; exit 1; }
          {
            echo "version=$v"
            echo "prerelease=$(python3 scripts/version.py prerelease "$v")"
            echo "cef=$cef"
          } >> "$GITHUB_OUTPUT"
          # The Arch package's file times and builddate: the release commit's time.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "Version $v (pre-release: $(python3 scripts/version.py prerelease "$v")), CEF $cef"

      # Before the long build: a tag needs its CHANGELOG.md section (just release writes it).
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          mkdir -p dist
          if python3 scripts/changelog.py notes "$VERSION" CHANGELOG.md > dist/release-notes.md; then
            echo "Release notes: $(wc -l < dist/release-notes.md) lines"
          elif [ -n "$TAG" ]; then
            exit 1
          else
            echo "::warning::No CHANGELOG.md section for $VERSION (fine for a dry run)."
            rm dist/release-notes.md
          fi

      - name: Disk space
        run: |
          df -h / | tail -1
          # The release target dir, CEF (1.5 GB unpacked) and the two packages' work dirs need
          # room; drop the largest preinstalled SDKs when the runner has less than 30 GB free.
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 30 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
            df -h / | tail -1
          fi

      - name: System packages
        run: |
          sudo apt-get update -q
          # libgtk-4-dev and patchelf: the CEF runtime (docs/dev-setup.md); cmake and ninja: the
          # cef-dll-sys wrapper; dpkg-dev: fix-deb.sh's dpkg-shlibdeps; zstd and python3:
          # package-arch.sh; appstream and desktop-file-utils: check-deb.sh validates the AppStream
          # metainfo and the desktop entry. The packages' Depends come from this runner's libraries
          # (24.04).
          sudo apt-get install -y -q --no-install-recommends \
            libgtk-4-dev patchelf pkg-config cmake ninja-build dpkg-dev zstd python3 jq \
            appstream desktop-file-utils

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      # Dependencies' build artifacts and the registry. Saved from main only (the dry run): a
      # tag's cache would only ever serve a re-run of that tag.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The pinned cargo subcommands, compiled once per version pair: the Tauri CLI, and
      # cargo-about for the license notices `just package` generates (scripts/licenses.sh).
      - name: Restore the cargo tools
        id: cargo-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-about
          key: cargo-tools-tauri-${{ env.TAURI_CLI_VERSION }}-about-${{ env.CARGO_ABOUT_VERSION }}-ubuntu-24.04
      - name: Install the cargo tools
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: |
          cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          cargo install cargo-about --version "=$CARGO_ABOUT_VERSION" --locked --features cli
      - name: Save the cargo tools
        if: steps.cargo-tools.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-about
          key: ${{ steps.cargo-tools.outputs.cache-primary-key }}

      # Only the CEF archive (~310 MB, already compressed): the cef-dll-sys build script verifies
      # its checksum and unpacks it (1.5 GB) instead of downloading it.
      - name: Restore the CEF archive
        id: cef
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tauri-cef/${{ steps.version.outputs.cef }}/cef_binary_*_linux64_minimal.tar.bz2
          key: cef-${{ steps.version.outputs.cef }}-linux64-minimal

      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: just

      # vite and vitest need Node ^22.12 or >= 24 (ui/package-lock.json).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies
        working-directory: ui
        run: npm ci

      # `just package` = the license notices (scripts/licenses.sh, failing on a license outside
      # about.toml's allow-list), cargo tauri build (the UI build and its notices first),
      # fix-deb.sh, check-deb.sh (Depends, the setuid chrome-sandbox, icons, desktop entry and
      # the license notices) and package-arch.sh, with the plain version for a release.
      - name: Build the packages
        env:
          GITBOLT_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: CARGO_BUILD_JOBS=$(nproc) just package

      - name: Save the CEF archive
        if: steps.cef.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tauri-cef/${{ steps.version.outputs.cef }}/cef_binary_*_linux64_minimal.tar.bz2
          key: ${{ steps.cef.outputs.cache-primary-key }}

      # Installs it in archlinux:latest: dependencies, pacman -Qkk, chrome-sandbox, the license
      # notices in /usr/share/licenses/gitbolt, ldd and a headless launch.
      - name: Check the Arch package
        run: just check-arch-pkg

      - name: Collect the packages and SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deb=(target/release/bundle/deb/GitBolt_*_amd64.deb)
          pkg=(target/release/bundle/arch/GitBolt-*-x86_64.pkg.tar.zst)
          [ ${#deb[@]} = 1 ] && [ ${#pkg[@]} = 1 ] || { echo "::error::Expected one .deb and one Arch package: ${deb[*]} ${pkg[*]}"; exit 1; }
          [ "${deb[0]}" = "target/release/bundle/deb/GitBolt_${VERSION}_amd64.deb" ] || { echo "::error::Unexpected .deb name ${deb[0]}"; exit 1; }
          echo "deb version: $(dpkg-deb -f "${deb[0]}" Version); Arch package: $(basename "${pkg[0]}")"
          cp "${deb[0]}" "${pkg[0]}" dist/
          (cd dist && sha256sum -- *.deb *.pkg.tar.zst > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitbolt-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true # a re-run replaces the earlier attempt's artifact

  windows:
    name: Build the Windows installers
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      # The runner's git checks text files out with CRLF (core.autocrlf=true in its system
      # config); the sources are LF, as on Linux.
      - name: LF checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      # The tag's version, or tauri.conf.json's for a dry run: package-windows.ps1 checks that
      # GITBOLT_RELEASE_VERSION is a release version equal to tauri.conf.json's. The CEF version
      # keys its cache.
      - name: Version
        id: version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          $conf = (Get-Content -Raw crates/gitbolt-app/tauri.conf.json | ConvertFrom-Json).version
          $v = if ($env:TAG) { $env:TAG -replace '^v', '' } else { $conf }
          $lock = Get-Content -Raw Cargo.lock
          if ($lock -notmatch 'name = "cef"\r?\nversion = "[^+"]*\+([^"]+)"') { throw 'No CEF version in Cargo.lock' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "cef=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "Version $v, CEF $($Matches[1])"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # cargo-about, for the license notices (scripts/licenses.sh), compiled once per version.
      - name: Restore cargo-about
        id: cargo-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about.exe
          key: cargo-tools-about-${{ env.CARGO_ABOUT_VERSION }}-windows
      - name: Install cargo-about
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version "=$env:CARGO_ABOUT_VERSION" --locked --features cli
      - name: Save cargo-about
        if: steps.cargo-tools.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about.exe
          key: ${{ steps.cargo-tools.outputs.cache-primary-key }}

      # The CEF archive, as in the build job (cef-dll-sys verifies and unpacks it), and the pinned
      # packaging tools package-windows.ps1 downloads (NSIS, WiX, rcedit; it checks their hashes).
      - name: Restore the CEF archive and the packaging tools
        id: cef
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/tauri-cef/${{ steps.version.outputs.cef }}/cef_binary_*_windows64_minimal.tar.bz2
            target/windows-tools
          key: cef-${{ steps.version.outputs.cef }}-windows64-minimal-${{ hashFiles('scripts/package-windows.ps1') }}

      # cef-dll-sys builds CEF's C++ wrapper with CMake and Ninja.
      - name: Ninja on PATH
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: just

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies
        working-directory: ui
        run: npm ci

      # `just package-windows`: the notices, the UI, gitbolt-app as a DLL, the staged layout
      # (CEF's bootstrap as GitBolt.exe, checked against the CEF build), then the NSIS installer
      # and the MSI, ICE-validated.
      #
      # Signing (none yet): set GITBOLT_SIGN_COMMAND here, e.g. from a secret, to a command that
      # signs the path appended to it in place. The script then signs GitBolt.exe and GitBolt.dll
      # with the same certificate (the bootstrap requires it), the NSIS uninstaller and installer,
      # and the MSI. See docs/releasing.md.
      # Windows PowerShell, not the job's pwsh: package-windows runs powershell.exe, which can't load
      # its own modules (Get-FileHash) with PowerShell 7's PSModulePath inherited.
      - name: Build the installers
        shell: powershell
        env:
          GITBOLT_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $env:CARGO_BUILD_JOBS = "$env:NUMBER_OF_PROCESSORS"
          just package-windows

      - name: Save the CEF archive and the packaging tools
        if: steps.cef.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/tauri-cef/${{ steps.version.outputs.cef }}/cef_binary_*_windows64_minimal.tar.bz2
            target/windows-tools
          key: ${{ steps.cef.outputs.cache-primary-key }}

      - name: Collect the installers and their checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $out = 'target/release/bundle/windows'
          $files = @("GitBolt_${env:VERSION}_x64-setup.exe", "GitBolt_${env:VERSION}_x64.msi")
          New-Item -ItemType Directory -Force dist-windows | Out-Null
          foreach ($f in $files) {
            if (-not (Test-Path "$out/$f")) { throw "Missing $f in $out: $((Get-ChildItem $out).Name -join ', ')" }
            Copy-Item "$out/$f" dist-windows/
          }
          # sha256sum's format, so the release job checks and merges it with the Linux one.
          $sums = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 "dist-windows/$f").Hash.ToLower(), $f }
          [IO.File]::WriteAllText("$PWD/dist-windows/SHA256SUMS", ($sums -join "`n") + "`n")
          Get-Content dist-windows/SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitbolt-${{ steps.version.outputs.version }}-windows
          path: dist-windows/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true

  release:
    name: Draft the GitHub release
    needs: [plan, build, windows]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # attestations: the Sigstore signing certificate
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gitbolt-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gitbolt-${{ needs.build.outputs.version }}-windows
          path: dist-windows

      # Each job's checksums, then one SHA256SUMS for all the packages.
      - name: Verify SHA256SUMS
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          (cd dist-windows && sha256sum -c SHA256SUMS)
          mv dist-windows/*.exe dist-windows/*.msi dist/
          cat dist-windows/SHA256SUMS >> dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS && cat SHA256SUMS)

      # Artifact attestations need a public repository, or GitHub Enterprise Cloud for a private
      # one: while the repository is private this is skipped unless the GITBOLT_ATTEST variable is
      # 'true'.
      - name: Build provenance
        if: ${{ !github.event.repository.private || vars.GITBOLT_ATTEST == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/*.exe
            dist/*.msi

      # Creates the draft, or on a re-run updates it and replaces its assets (--clobber). A
      # release that's already published is left alone: the run fails instead.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          assets=(dist/*.deb dist/*.pkg.tar.zst dist/*.exe dist/*.msi dist/SHA256SUMS)
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is already published; not replacing its assets."
              exit 1
            fi
            gh release edit "$TAG" --draft --title "GitBolt $VERSION" --notes-file dist/release-notes.md --prerelease="$PRERELEASE"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --draft --verify-tag --title "GitBolt $VERSION" \
              --notes-file dist/release-notes.md --prerelease="$PRERELEASE" "${assets[@]}"
          fi
          url=$(gh release view "$TAG" --json url --jq .url)
          echo "Draft release: $url" | tee -a "$GITHUB_STEP_SUMMARY"
