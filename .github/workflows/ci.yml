# A light check on pushes to main and pull requests: the UI's type check. The test suites run
# locally (just test); releases are release.yml. Actions are pinned by commit, as in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI type check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # vite and vitest need Node ^22.12 or >= 24 (ui/package-lock.json).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
